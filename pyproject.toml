[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-multi-venue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nautilus_trader",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "ib_async>=2.1.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.0",
    "websockets>=15.0",
    "pdfplumber>=0.11",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["backends*", "adapters*", "tests*", "api_server*", "backtest_runner*", "condition_engine*", "strategy_spawner*", "correlation_analysis*", "beta_analysis*", "risk_analysis*", "fred*", "ecos*", "corp_finance*", "live_engine*", "monte_carlo*", "regime_filter*", "krx*", "sec_edgar*", "ksd*", "options*", "futures*", "forex*", "hyperliquid*", "kr_universe*", "orderflow*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
